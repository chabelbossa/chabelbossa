<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chabel Bossa profile footer</title>
  <desc id="desc">A clean footer visual with a dark background and orange accent line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.58" stop-color="#282C3E"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="42" x2="1080" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F28100" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#F28100"/>
      <stop offset="0.8" stop-color="#F28100"/>
      <stop offset="1" stop-color="#F28100" stop-opacity="0"/>
