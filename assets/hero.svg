<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chabel Bossa - Backend and Full-Stack Software Engineer</title>
  <desc id="desc">A premium profile banner for Chabel Bossa, backend and full-stack software engineer moving toward applied AI systems, automation, and mathematical modeling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.52" stop-color="#282C3E"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="144" y1="308" x2="1104" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F28100"/>
      <stop offset="0.52" stop-color="#FFB15C"/>
      <stop offset="1" stop-color="#F28100"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 74) rotate(139) scale(430 260)">
      <stop stop-color="#F28100" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#F28100" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#050816" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#glow)"/>

  <path d="M0 277C164 226 290 247 460 270C642 294 792 296 1200 197V360H0V277Z" fill="#FFFFFF" fill-opacity="0.05"/>
  <path d="M0 300C202 248 397 319 604 282C836 240 982 227 1200 255V360H0V300Z" fill="url(#accent)" fill-opacity="0.13"/>

