    <rect x="70" y="64" width="1060" height="232" rx="26" fill="#0F172A" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.10"/>
  </g>

  <circle cx="1002" cy="106" r="58" fill="#F28100" fill-opacity="0.10"/>
  <circle cx="1002" cy="106" r="34" fill="#F28100" fill-opacity="0.16"/>
  <path d="M984 106H1020M1002 88V124" stroke="#F28100" stroke-width="5" stroke-linecap="round"/>

